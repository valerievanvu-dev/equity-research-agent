[project]
name = "eqr"
version = "0.1.0"
description = "Equity research agent: tool-use loop, evals, and trajectory export for post-training"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "httpx>=0.27",
    "openai>=3.57.0",
    "openai-agents>=0.25.0",
    "pydantic>=2.7",
    "reportlab>=5.1.0",
]

[dependency-groups]
dev = [
    "pypdf>=7.1.1",
    "pytest>=8",
]

[project.scripts]
eqr = "eqr.cli:main"
eqr-screen = "eqr.screen:main"
eqr-track = "eqr.track:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eqr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
